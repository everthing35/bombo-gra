<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wybuchowa Bomba - Lobby</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #2a2a2a; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        input { padding: 10px; margin: 10px; font-size: 16px; width: 80%; border-radius: 5px; border: none; background: #3a3a3a; color: white; text-align: center; }
        button { padding: 12px 20px; font-size: 16px; background: #2ed573; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        button:hover { background: #26af5f; }
        .btn-create { background: #ffa502; color: #1a1a1a; }
        .btn-create:hover { background: #ffb143; }
        .player { padding: 10px; margin: 5px; background: #333; border-radius: 5px; font-size: 18px; }
        .error { color: #ff4757; font-weight: bold; margin-top: 10px; }
        .room-code { font-size: 32px; letter-spacing: 5px; color: #ffa502; background: #111; padding: 10px; border-radius: 8px; margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>💣 Wybuchowa Bomba</h1>

    <!-- EKRAN STARTOWY -->
    <div id="login-screen" class="box">
        <p>Wpisz swój nick:</p>
        <input id="nick" placeholder="Twój Nick" maxlength="12"><br>
        <button class="btn-create" onclick="createRoom()">STÓRZ LOBBY</button>
        <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
        <p>Lub dołącz do istniejącego:</p>
        <input id="roomInput" placeholder="5-cyfrowe ID Lobby" maxlength="5"><br>
        <button onclick="joinRoom()">DOŁĄCZ DO LOBBY</button>
        <p id="error-msg" class="error"></p>
    </div>

    <!-- EKRAN LOBBY -->
    <div id="lobby-screen" class="box" style="display:none;">
        <p>ID Twojego Lobby:</p>
        <div class="room-code" id="display-room-id">-----</div>
        <p>Osoby w lobby (maks. 5):</p>
        <div id="playerList">Czekanie na graczy...</div>
    </div>

    <script>
        const socket = io();

        function createRoom() {
            const nickname = document.getElementById('nick').value.trim();
            if (!nickname) {
                document.getElementById('error-msg').textContent = "Najpierw wpisz swój nick!";
                return;
            }
            document.getElementById('error-msg').textContent = "";
            const roomCode = Math.floor(10000 + Math.random() * 90000).toString();
            socket.emit('createRoom', { roomCode, nickname });
        }

        function joinRoom() {
            const nickname = document.getElementById('nick').value.trim();
            const roomCode = document.getElementById('roomInput').value.trim();
            if (!nickname) {
                document.getElementById('error-msg').textContent = "Najpierw wpisz swój nick!";
                return;
            }
            if (roomCode.length !== 5) {
                document.getElementById('error-msg').textContent = "ID lobby musi mieć dokładnie 5 cyfr!";
                return;
            }
            document.getElementById('error-msg').textContent = "";
            socket.emit('joinRoom', { roomCode, nickname });
        }

        socket.on('roomCreated', (roomCode) => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';
            document.getElementById('display-room-id').textContent = roomCode;
        });

        socket.on('roomJoined', (roomCode) => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';
            document.getElementById('display-room-id').textContent = roomCode;
        });

        socket.on('updatePlayers', (players) => {
            const list = document.getElementById('playerList');
            list.innerHTML = players.map((p, index) => `
                <div class="player">
                    👤 ${p.name} ${index === 0 ? '(Host)' : ''}
                </div>
            `).join('');
        });

        socket.on('errorMsg', (msg) => {
            document.getElementById('error-msg').textContent = msg;
        });
    </script>
</body>
</html>
